<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Baby Kay - Virtual Boyfriend 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b091a; color: #fff; position: fixed; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    /* UI Overlay */
    #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; z-index: 10; }
    .interactive { pointer-events: auto; }
    
    /* Top Bar Header */
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
    .status-card { background: rgba(18, 14, 36, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 118, 117, 0.3); border-radius: 14px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); max-width: 70%; }
    .status-card h2 { font-size: 15px; color: #ff7675; display: flex; align-items: center; gap: 4px; }
    .meter-container { margin-top: 4px; font-size: 10px; font-weight: bold; color: #dfe6e9; }
    .meter-bar { width: 100%; max-width: 140px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #ff7675, #e84393); width: 85%; transition: width 0.5s ease; }

    .api-status { background: rgba(46, 204, 113, 0.2); border: 1px solid rgba(46, 204, 113, 0.4); color: #2ecc71; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; backdrop-filter: blur(8px); }

    /* Bottom Container */
    .bottom-container { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }

    /* Action Buttons */
    .action-panel { display: flex; gap: 6px; width: 100%; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .action-panel::-webkit-scrollbar { display: none; }
    .btn { background: rgba(25, 20, 45, 0.85); border: 1px solid rgba(255, 118, 117, 0.4); color: #fff; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 12px; white-space: nowrap; backdrop-filter: blur(8px); flex-shrink: 0; }
    .btn:active { transform: scale(0.95); background: #ff7675; color: #1e1932; }

    /* Chat Box Responsive */
    .chat-box { background: rgba(15, 12, 32, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 100%; height: 200px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 12px; line-height: 1.4; word-wrap: break-word; }
    .msg.kay { background: rgba(255, 118, 117, 0.2); border: 1px solid rgba(255, 118, 117, 0.4); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.user { background: #6c5ce7; align-self: flex-end; border-bottom-right-radius: 2px; }
    
    .chat-input-area { display: flex; padding: 6px; background: rgba(0,0,0,0.3); gap: 6px; }
    .chat-input-area input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px 10px; color: #fff; outline: none; font-size: 13px; }
    .chat-input-area button { background: #ff7675; border: none; padding: 8px 12px; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px; }

    /* Game HUD & Close Button */
    #game-hud { display: none; position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.85); padding: 10px 16px; border-radius: 12px; border: 2px solid #fdcb6e; text-align: center; }
    #game-hud h3 { color: #fdcb6e; font-size: 13px; margin-bottom: 2px; }
    .close-game-btn { background: #d63031; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 10px; font-weight: bold; cursor: pointer; margin-top: 6px; }

    .game-controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: none; gap: 40px; pointer-events: auto; }
    .ctrl-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.25); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 20px; font-weight: bold; backdrop-filter: blur(5px); }
    .ctrl-btn:active { background: rgba(255, 118, 117, 0.8); }

    @media (min-width: 768px) {
      .bottom-container { flex-direction: row; justify-content: space-between; align-items: flex-end; }
      .action-panel { width: auto; flex-wrap: wrap; }
      .chat-box { width: 360px; height: 240px; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <!-- Top Status Bar -->
    <div class="top-bar">
      <div class="status-card">
        <h2>❤️ Baby Kay <span style="font-size:10px; color:#a29bfe;">(Virtual Boyfriend)</span></h2>
        <div class="meter-container">
          LOVE METER: <span id="love-val">85%</span>
          <div class="meter-bar"><div class="meter-fill" id="love-bar" style="width:85%"></div></div>
        </div>
        <div style="font-size: 10px; margin-top: 3px; color: #ffeaa7;">Mood: <span id="kay-mood">Kangen banget sama kamu 🥰</span></div>
      </div>

      <div class="api-status">🟢 AI Active</div>
    </div>

    <!-- Game HUD -->
    <div id="game-hud" class="interactive">
      <h3>LOVE CATCHER</h3>
      <div>SKOR: <span id="game-score" style="font-size:18px; font-weight:bold; color:#fff;">0</span></div>
      <button class="close-game-btn" onclick="toggleMiniGame()">✖ KELUAR GAME</button>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="game-controls" id="game-ctrls">
      <button class="ctrl-btn" id="left-btn">◄</button>
      <button class="ctrl-btn" id="right-btn">►</button>
    </div>

    <!-- Bottom Container -->
    <div class="bottom-container">
      <div class="action-panel interactive" id="action-panel">
        <button class="btn" onclick="sendGift('rose')">🌹 Mawar</button>
        <button class="btn" onclick="sendGift('pizza')">🍕 Pizza</button>
        <button class="btn" onclick="sendGift('ps5')">🎮 PS5</button>
        <button class="btn" onclick="sendGift('coffee')">☕ Kopi</button>
        <button class="btn" style="border-color:#fdcb6e;" onclick="toggleMiniGame()">🎮 Mini Game</button>
      </div>

      <div class="chat-box interactive" id="chat-box">
        <div class="chat-messages" id="chat-messages">
          <div class="msg kay">Halo sayang! Dari tadi Kay nungguin kamu tauuu... Kangen banget! 🥺❤️</div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="user-input" placeholder="Ketik pesan buat Kay..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()">Kirim</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Token Hugging Face Baru Kamu
    const hfToken = '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';

    // Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b091a);
    scene.fog = new THREE.FogExp2(0x0b091a, 0.035);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    function adjustCamera() {
      if (window.innerWidth < 768) {
        camera.position.set(0, 3.8, 9.5);
      } else {
        camera.position.set(0, 3.2, 8);
      }
      camera.lookAt(0, 1.2, 0);
    }
    adjustCamera();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xff7675, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const deskLight = new THREE.PointLight(0x74b9ff, 1.2, 8);
    deskLight.position.set(-2, 2.5, -2);
    scene.add(deskLight);

    // Room Setup
    const roomGroup = new THREE.Group();
    scene.add(roomGroup);

    const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 10), new THREE.MeshLambertMaterial({ color: 0x2d3436 }));
    floor.position.y = -0.1;
    roomGroup.add(floor);

    const desk = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.8, 1.2), new THREE.MeshLambertMaterial({ color: 0x0984e3 }));
    desk.position.set(-2.5, 0.4, -2.2);
    roomGroup.add(desk);

    const monMat = new THREE.MeshBasicMaterial({ color: 0x00cec9 });
    const mon1 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.65, 0.1), monMat);
    mon1.position.set(-2.8, 1.15, -2.2);
    const mon2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.65, 0.1), monMat);
    mon2.position.set(-1.8, 1.15, -2.0);
    mon2.rotation.y = -0.25;
    roomGroup.add(mon1, mon2);

    const bed = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 3.8), new THREE.MeshLambertMaterial({ color: 0x6c5ce7 }));
    bed.position.set(3, 0.25, -2);
    roomGroup.add(bed);

    // Character Baby Kay
    function createBabyKay() {
      const kay = new THREE.Group();

      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff7675 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.6), bodyMat);
      body.position.y = 1.05;
      kay.add(body);

      const headMat = new THREE.MeshLambertMaterial({ color: 0xffeaa7 });
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), headMat);
      head.position.y = 2.0;
      kay.add(head);

      const hairMat = new THREE.MeshLambertMaterial({ color: 0x2d3436 });
      const hairTop = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.25, 0.95), hairMat);
      hairTop.position.set(0, 2.45, 0);
      const hairBang = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.28, 0.3), hairMat);
      hairBang.position.set(0, 2.28, 0.38);
      kay.add(hairTop, hairBang);

      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x2d3436 });
      const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.05), eyeMat);
      eye1.position.set(0.2, 2.05, 0.43);
      const eye2 = eye1.clone();
      eye2.position.x = -0.2;
      kay.add(eye1, eye2);

      const legMat = new THREE.MeshLambertMaterial({ color: 0x0984e3 });
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.7, 0.4), legMat);
      legL.position.set(-0.22, 0.35, 0);
      const legR = legL.clone();
      legR.position.x = 0.22;
      kay.add(legL, legR);

      const armGeo = new THREE.BoxGeometry(0.28, 0.8, 0.3);
      const armL = new THREE.Mesh(armGeo, bodyMat);
      armL.position.set(-0.6, 1.0, 0);
      const armR = new THREE.Mesh(armGeo, bodyMat);
      armR.position.set(0.6, 1.0, 0);
      armR.name = "rightArm";
      kay.add(armL, armR);

      return kay;
    }

    const kayCharacter = createBabyKay();
    scene.add(kayCharacter);

    // Interactive & Gifts
    let activeParticles = [];
    let activeGiftMesh = null;
    let isGameActive = false;
    let score = 0;
    let gameItems = [];

    function sendGift(type) {
      if (activeGiftMesh) scene.remove(activeGiftMesh);

      const giftGroup = new THREE.Group();
      giftGroup.position.set(0, 1.5, 1.8);

      if (type === 'rose') {
        const stem = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.8, 0.05), new THREE.MeshLambertMaterial({color: 0x00b894}));
        const flower = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshLambertMaterial({color: 0xd63031}));
        flower.position.y = 0.4;
        giftGroup.add(stem, flower);
        createParticles(0xff7675, 20);
        updateKayMood("Suka banget Mawarnya! Makasih 🌹", 10);
      } else if (type === 'pizza') {
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.8), new THREE.MeshLambertMaterial({color: 0xe17055}));
        const slice = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.4), new THREE.MeshLambertMaterial({color: 0xfdcb6e}));
        slice.position.y = 0.15;
        giftGroup.add(box, slice);
        createParticles(0xfdcb6e, 15);
        updateKayMood("Nyam! Pizza-nya enak 🍕", 8);
      } else if (type === 'ps5') {
        const ps5 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.5), new THREE.MeshBasicMaterial({color: 0xffffff}));
        const glow = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.4), new THREE.MeshBasicMaterial({color: 0x0984e3}));
        ps5.add(glow);
        giftGroup.add(ps5);
        createParticles(0x74b9ff, 25);
        updateKayMood("WAH PS5! Kamu terbaik! 🎮", 15);
      } else if (type === 'coffee') {
        const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.4), new THREE.MeshLambertMaterial({color: 0x6c5ce7}));
        giftGroup.add(cup);
        createParticles(0xffffff, 10);
        updateKayMood("Kopi hangat biar semangat ☕", 5);
      }

      activeGiftMesh = giftGroup;
      scene.add(activeGiftMesh);
      jumpKay();
    }

    function createParticles(colorHex, count) {
      for(let i=0; i<count; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshBasicMaterial({color: colorHex}));
        p.position.set((Math.random()-0.5)*2, 1 + Math.random()*2, 1 + (Math.random()-0.5)*2);
        p.userData = { vy: 0.02 + Math.random()*0.03, vx: (Math.random()-0.5)*0.02 };
        scene.add(p);
        activeParticles.push(p);
      }
    }

    function jumpKay() {
      let startTime = Date.now();
      const animateJump = () => {
        let elapsed = (Date.now() - startTime) / 1000;
        if (elapsed < 0.45) {
          kayCharacter.position.y = Math.sin(elapsed * Math.PI * 2.2) * 0.45;
          requestAnimationFrame(animateJump);
        } else {
          kayCharacter.position.y = 0;
        }
      };
      animateJump();
    }

    function updateKayMood(moodText, loveBonus) {
      document.getElementById('kay-mood').innerText = moodText;
      let curLove = parseInt(document.getElementById('love-val').innerText);
      let newLove = Math.min(100, curLove + loveBonus);
      document.getElementById('love-val').innerText = newLove + "%";
      document.getElementById('love-bar').style.width = newLove + "%";
    }

    // Hugging Face Router API dengan Token Baru
  async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      input.value = '';
      jumpKay();

      try {
        // Menggunakan server AI alternatif gratis, cepat, tanpa token, dan bebas CORS
        const prompt = encodeURIComponent(`Kamu adalah Baby Kay, pacar virtual cowok 3D yang sangat penyayang, lucu, ramah, dan romantis. Selalu panggil pasanganmu dengan sebutan 'sayang' atau 'kamu'. Jawablah singkat maksimal 2 kalimat dan gunakan bahasa Indonesia santai. User bilang: ${text}`);
        
        const response = await fetch(`https://text.pollinations.ai/${prompt}?model=openai`);
        const reply = await response.text();

        if (reply && reply.trim().length > 0) {
          appendMsg(reply.trim(), 'kay');
        } else {
          appendMsg("Aduh bentar ya sayang, Kay agak melamun nih... Coba sapa lagi!", 'kay');
        }
        jumpKay();
      } catch (err) {
        console.error(err);
        appendMsg("Aduh jaringan lagi agak terganggu nih sayang 🥺", 'kay');
      }
    }
    function appendMsg(text, sender) {
      const box = document.getElementById('chat-messages');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    // Mini Game System
    function toggleMiniGame() {
      isGameActive = !isGameActive;
      const gameHud = document.getElementById('game-hud');
      const gameCtrls = document.getElementById('game-ctrls');
      const chatBox = document.getElementById('chat-box');
      const actionPanel = document.getElementById('action-panel');

      if (isGameActive) {
        gameHud.style.display = 'block';
        gameCtrls.style.display = 'flex';
        chatBox.style.display = 'none';
        actionPanel.style.display = 'none';
        score = 0;
        document.getElementById('game-score').innerText = score;
        camera.position.set(0, 4.8, 6.8);
        camera.lookAt(0, 0, 0);
      } else {
        gameHud.style.display = 'none';
        gameCtrls.style.display = 'none';
        chatBox.style.display = 'flex';
        actionPanel.style.display = 'flex';
        adjustCamera();
        gameItems.forEach(item => scene.remove(item));
        gameItems = [];
      }
    }

    let kayTargetX = 0;
    window.addEventListener('keydown', (e) => {
      if (!isGameActive) return;
      if (e.key === 'ArrowLeft') kayTargetX = Math.max(-2.5, kayTargetX - 0.7);
      if (e.key === 'ArrowRight') kayTargetX = Math.min(2.5, kayTargetX + 0.7);
    });

    document.getElementById('left-btn').onclick = () => { if(isGameActive) kayTargetX = Math.max(-2.5, kayTargetX - 0.7); };
    document.getElementById('right-btn').onclick = () => { if(isGameActive) kayTargetX = Math.min(2.5, kayTargetX + 0.7); };

    function spawnGameItem() {
      if (!isGameActive) return;
      const isBad = Math.random() < 0.25;
      const itemGeo = isBad ? new THREE.BoxGeometry(0.35, 0.35, 0.35) : new THREE.BoxGeometry(0.28, 0.28, 0.28);
      const itemMat = new THREE.MeshBasicMaterial({ color: isBad ? 0xd63031 : 0xff7675 });
      const item = new THREE.Mesh(itemGeo, itemMat);
      
      item.position.set((Math.random() - 0.5) * 5, 5.8, 0);
      item.userData = { isBad: isBad };
      scene.add(item);
      gameItems.push(item);
    }

    setInterval(spawnGameItem, 850);

    // Loop Render Main Engine
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      let time = clock.getElapsedTime();

      if (!isGameActive) {
        kayCharacter.position.y = Math.sin(time * 2) * 0.04;
        const rightArm = kayCharacter.getObjectByName("rightArm");
        if (rightArm) rightArm.rotation.z = Math.sin(time * 3.8) * 0.22 + 0.3;
      } else {
        kayCharacter.position.x += (kayTargetX - kayCharacter.position.x) * 0.22;
        kayCharacter.position.z = 0;

        for (let i = gameItems.length - 1; i >= 0; i--) {
          const item = gameItems[i];
          item.position.y -= 0.075;

          if (Math.abs(item.position.y - kayCharacter.position.y) < 0.6 &&
              Math.abs(item.position.x - kayCharacter.position.x) < 0.6) {
            
            if (item.userData.isBad) {
              score = Math.max(0, score - 5);
            } else {
              score += 10;
              createParticles(0xff7675, 5);
            }
            document.getElementById('game-score').innerText = score;
            scene.remove(item);
            gameItems.splice(i, 1);
            continue;
          }

          if (item.position.y < -1) {
            scene.remove(item);
            gameItems.splice(i, 1);
          }
        }
      }

      if (activeGiftMesh) {
        activeGiftMesh.rotation.y += 0.02;
        activeGiftMesh.position.y = 1.5 + Math.sin(time * 3) * 0.1;
      }

      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.position.y += p.userData.vy;
        p.position.x += p.userData.vx;
        p.scale.multiplyScalar(0.95);
        if (p.scale.x < 0.01) {
          scene.remove(p);
          activeParticles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      adjustCamera();
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
